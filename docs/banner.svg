<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="EasyPivot: right-click IOC pivoting for Microsoft Sentinel and Defender XDR">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a33"/>
      <stop offset="1" stop-color="#132f5c"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fa3ff"/>
      <stop offset="1" stop-color="#9b7bff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)"/>
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <text x="72" y="150" font-size="78" font-weight="700" fill="#ffffff">EasyPivot</text>
    <text x="74" y="200" font-size="26" fill="#b9cdf2">Right-click any IOC in Microsoft Sentinel or Defender XDR.</text>
    <text x="74" y="236" font-size="26" fill="#b9cdf2">Pivot, follow playbooks, keep the case, ship the report.</text>
    <g font-size="16" font-weight="600">
      <rect x="74" y="270" width="134" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#4fa3ff"/>
      <text x="141" y="292" fill="#cfe2ff" text-anchor="middle">86 KQL rules</text>
      <rect x="220" y="270" width="190" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#4fa3ff"/>
      <text x="315" y="292" fill="#cfe2ff" text-anchor="middle">Sentinel + Defender</text>
      <rect x="422" y="270" width="160" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#9b7bff"/>
      <text x="502" y="292" fill="#e3d9ff" text-anchor="middle">13 playbooks</text>
    </g>
  </g>
  <!-- pivot graph -->
  <g stroke="url(#edge)" stroke-width="3" fill="none" opacity="0.9">
    <path d="M820 180 L960 100"/><path d="M820 180 L960 260"/><path d="M960 100 L1110 140"/>
    <path d="M960 260 L1110 220"/><path d="M1110 140 L1110 220" stroke-dasharray="6 6"/>
  </g>
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">
    <circle cx="820" cy="180" r="44" fill="#4fa3ff"/><text x="820" y="186" fill="#0b1a33">IP</text>
    <circle cx="960" cy="100" r="40" fill="#1f6fd1" stroke="#4fa3ff" stroke-width="2"/><text x="960" y="106" fill="#ffffff">Account</text>
    <circle cx="960" cy="260" r="40" fill="#1f6fd1" stroke="#4fa3ff" stroke-width="2"/><text x="960" y="266" fill="#ffffff">Device</text>
    <circle cx="1110" cy="140" r="36" fill="#6b4fd8" stroke="#9b7bff" stroke-width="2"/><text x="1110" y="146" fill="#ffffff">Process</text>
    <circle cx="1110" cy="220" r="36" fill="#6b4fd8" stroke="#9b7bff" stroke-width="2"/><text x="1110" y="226" fill="#ffffff">Hash</text>
  </g>
</svg>
